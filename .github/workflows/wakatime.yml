name: Waka Readme

on:
  schedule:
    # Spustí se každou noc v 00:00
    - cron: '0 0 * * *'
  workflow_dispatch: # Aby sis to mohl spustit ručně tlačítkem

jobs:
  update-readme:
    name: Update Readme with Dev Metrics
    runs-on: ubuntu-latest
    steps:
      - uses: athul/waka-readme@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          # Tady jsou ty "Flags", na které ses ptal:
          SHOW_TITLE: true
          SECTION_NAME: waka
          BLOCKS: 📅
          TIME_RANGE: last_7_days
          SHOW_TIME: true
          SHOW_MASKED_TIME: true